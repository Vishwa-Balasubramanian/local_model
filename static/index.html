<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Local Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><span class="logo">L</span><strong>Local Chat</strong></div>
    <button id="new-chat" class="primary">＋ New chat</button>
    <div id="history" aria-label="Chat history"></div>
    <div class="privacy"><span></span> Private · runs locally</div>
  </aside>

  <main>
    <header>
      <button id="menu" aria-label="Toggle menu">☰</button>
      <select id="model" aria-label="Model"><option>Loading models…</option></select>
      <button id="settings-button" aria-label="Settings">⚙</button>
    </header>

    <section id="messages" aria-live="polite">
      <div id="welcome">
        <div class="hero-logo">L</div>
        <h1>Your private AI workspace</h1>
        <p>Ask questions, write code, or explore ideas. Everything stays on this machine.</p>
        <div class="suggestions">
          <button>Explain a difficult concept simply</button>
          <button>Help me brainstorm a project idea</button>
          <button>Write a Python script to organize files</button>
          <button>Review this code for potential bugs</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <form id="composer">
        <textarea id="prompt" rows="1" placeholder="Message your local model…" aria-label="Message"></textarea>
        <button id="send" type="submit" aria-label="Send">↑</button>
      </form>
      <small>Local models can make mistakes. Verify important information.</small>
    </div>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <div class="dialog-title"><h2>Generation settings</h2><button value="cancel">×</button></div>
      <label>System prompt<textarea id="system-prompt" rows="9" placeholder="Loading the built-in assistant prompt…"></textarea></label>
      <label>Temperature <output id="temperature-value">0.7</output><input id="temperature" type="range" min="0" max="2" value="0.7" step="0.1"></label>
      <label>Top P <output id="top-p-value">0.9</output><input id="top-p" type="range" min="0.1" max="1" value="0.9" step="0.05"></label>
      <button class="primary" value="default">Save</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
